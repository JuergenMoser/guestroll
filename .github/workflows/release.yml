name: Release

# A version tag (v1.2.3), pushed from main, publishes the release: the
# multi-arch image (always to GHCR, to Docker Hub when DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN are set), then a GitHub release with generated notes.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: Publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HAS_DOCKERHUB == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: images
        run: |
          {
            echo "list<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY,,}"
            if [ "$HAS_DOCKERHUB" = "true" ]; then echo "achedon12/guestroll"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.images.outputs.list }}
          # latest follows the newest version tag (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Docker Scout also analyses every pushed tag on Docker Hub by itself (enabled
      # on the repository); this run puts the same report in the release's summary.
      - if: env.HAS_DOCKERHUB == 'true'
        name: Docker Scout vulnerabilities
        uses: docker/scout-action@221e7f4860634eeb1579e3bd7ca232e577bd1864 # v1.26.0
        with:
          command: cves,recommendations
          image: registry://achedon12/guestroll:${{ steps.meta.outputs.version }}
          only-fixed: true
          summary: true
          write-comment: false

      - if: env.HAS_DOCKERHUB == 'true'
        name: Sync the Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: achedon12/guestroll
          short-description: "Self-hosted QR-code photo sharing for events. Guests scan, shoot, done."
          readme-filepath: ./docs/docker-hub.md

  notes:
    name: GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The install kit is the release's downloadable asset: it is what the
      # README's download badge counts (source archives aren't counted).
      - name: Build the install kit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          kit="guestroll-${TAG}-compose"
          mkdir "$kit"
          sed "s#ghcr.io/achedon12/guestroll:latest#ghcr.io/achedon12/guestroll:${TAG#v}#" docker-compose.yml > "$kit/docker-compose.yml"
          cp .env.example "$kit/.env.example"
          cat > "$kit/INSTALL.md" <<'EOF'
          # Guestroll: install kit

          1. Copy `.env.example` to `.env` and fill in at least `PUBLIC_URL` and `ADMIN_PASSWORD`.
          2. Start it: `docker compose up -d`
          3. Open `PUBLIC_URL/admin`, sign in as `admin`, create an event and print its QR code.

          Phones only open the camera on HTTPS pages: put Guestroll behind a reverse proxy
          with a certificate. Ready-made Caddy, Traefik and nginx setups:
          https://github.com/achedon12/guestroll/wiki/Deployment

          Every setting: https://github.com/achedon12/guestroll/wiki/Configuration
          EOF
          zip -qr "$kit.zip" "$kit"

      - name: Create the release with generated notes and the kit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber "guestroll-${TAG}-compose.zip"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --generate-notes --title "$TAG" "guestroll-${TAG}-compose.zip"
          fi
