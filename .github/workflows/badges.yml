name: Badges

# Fresh download counts for the README: shields.io caches Docker Hub's for six
# hours. The counts go to the `badges` branch, read by shields' endpoint badge.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: badges
  cancel-in-progress: true

jobs:
  counts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - name: Count
        run: python3 .github/scripts/badges.py out

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -q badges
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if git fetch -q --depth 1 origin badges; then git checkout -q -b badges FETCH_HEAD; else git checkout -q --orphan badges; fi
          cp ../out/*.json .
          git add -A
          if git diff --cached --quiet; then
            echo "Counts unchanged."
          else
            git commit -q -m "Update download counts"
            git push -q origin HEAD:badges
          fi
