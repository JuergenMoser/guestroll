name: Website

# Publishes site/ to GitHub Pages, with the screenshots and fonts it uses
# copied from the repository, whenever main changes them.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/assets/**
      - assets/fonts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble the site
        run: |
          mkdir -p _site/assets/fonts _site/assets/screenshots
          cp -r site/. _site/
          cp docs/assets/logo.svg _site/assets/logo.svg
          cp docs/assets/screenshots/*.png _site/assets/screenshots/
          cp assets/fonts/*.woff _site/assets/fonts/
          cp docs/assets/social.png _site/assets/social.png

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
