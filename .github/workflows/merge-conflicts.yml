name: Merge conflicts

# "merge conflict" label on pull requests that no longer apply cleanly to their
# target branch: to rebase before review. Checked again on every push to develop
# or main, which can make others conflict.
#
# Using pull_request_target is safe here: no code from the pull request is
# checked out or run, a pinned action adds or removes the label.
on:
  push:
    branches: [develop, main]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  label:
    name: Label conflicts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: eps1lon/actions-label-merge-conflict@0273be72a0bbd58fcd71d0d6c02c209b50d1e5e1 # v3.1.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          dirtyLabel: merge conflict
          commentOnDirty: >
            This pull request conflicts with its target branch. Rebase it
            (`git fetch origin && git rebase origin/develop`) so it can be
            reviewed.
