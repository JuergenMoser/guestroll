name: Docs

# The website (VitePress, every release's docs) and the wiki, both built from
# docs/. Runs when develop changes the docs and when a release is tagged, so
# the new release becomes the docs at the root of the site and in the wiki.
on:
  push:
    branches: [develop]
    tags: ["v*.*.*"]
    paths:
      - docs/**
      - .github/scripts/build-docs.py
      - .github/scripts/build-wiki.py
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  site:
    name: Build the website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # develop for next/ and today's configuration, applied to every release's docs
          ref: develop
          # every release tag, and "last updated" dates from git history
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci --no-audit --no-fund

      - name: Build every version
        run: python3 .github/scripts/build-docs.py site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  wiki:
    name: Sync the wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the wiki
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          # kept: the last step pushes to the wiki
          persist-credentials: true

      - name: Generate the pages from the docs of every release
        run: python3 .github/scripts/build-wiki.py . wiki

      - name: Publish
        working-directory: wiki
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
          else
            git commit -m "Sync from docs at ${SHA::7}"
            git push
          fi
