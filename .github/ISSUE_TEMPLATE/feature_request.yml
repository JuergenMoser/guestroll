name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe the situation at your event, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
