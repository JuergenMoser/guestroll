name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Create an event with…\n2. Scan the QR code on…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Image tag or commit (Admin → Settings shows it).
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker, Docker Compose, Node.js, Other]
  - type: input
    id: device
    attributes:
      label: Guest device and browser
      placeholder: iPhone 15, Safari 18
  - type: textarea
    id: logs
    attributes:
      label: Server logs
      render: text
