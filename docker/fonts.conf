<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for text rasterised by sharp (the QR code caption in PNG exports).
  sharp ships its own fontconfig; pointing it at the app's bundled font avoids
  installing system font packages, whose dependency (expat) carried CVEs.
-->
<fontconfig>
  <dir>/app/assets/fonts</dir>
  <cachedir>/tmp/.cache/fontconfig</cachedir>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Bricolage Grotesque</family></prefer>
  </alias>
</fontconfig>
